spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jastalant}
spring.datasource.username=${DB_USERNAME:jastalant}
spring.datasource.password=${DB_PASSWORD}
# Local development always captures mail, even when Gmail credentials exist in .env.
# Add the smtp profile AFTER local to enable real email for demos and the closed pilot.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.test-connection=false
app.mail.from=no-reply@jastalant.local
app.auth.refresh-cookie-secure=false
