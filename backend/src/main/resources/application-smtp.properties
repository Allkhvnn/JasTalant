# Real SMTP. Run with --spring.profiles.active=local,smtp to read backend/.env.
# Gmail defaults; use an app password, never the Google account password.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.test-connection=${SMTP_TEST_CONNECTION:true}
app.mail.from=${MAIL_FROM:${SMTP_USERNAME}}
