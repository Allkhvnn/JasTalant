verification.subject=JasTalant — email растау
verification.body=JasTalant email растау коды (24 сағат жарамды):\n\n%s\n\nТіркелмеген болсаңыз, бұл хатты елемеңіз.
reset.subject=JasTalant — құпиясөзді қалпына келтіру
reset.body=Жаңа JasTalant құпиясөзін орнату үшін сілтемені бір сағат ішінде ашыңыз:\n\n%s\n\nҚалпына келтіруді сұрамаған болсаңыз, бұл хатты елемеңіз.
invitation.subject=JasTalant — академияға шақыру
invitation.body=Сізді «%s» академиясына шақырды.\n\nСілтемені ашыңыз (72 сағат жарамды):\n%s\n\nШақыруды күтпеген болсаңыз, бұл хатты елемеңіз.
