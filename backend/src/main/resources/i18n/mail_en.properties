verification.subject=JasTalant — email verification
verification.body=Your JasTalant email verification code (valid for 24 hours):\n\n%s\n\nIf you did not register, please ignore this email.
reset.subject=JasTalant — password recovery
reset.body=To set a new JasTalant password, open this link within one hour:\n\n%s\n\nIf you did not request password recovery, please ignore this email.
invitation.subject=JasTalant — academy invitation
invitation.body=You have been invited to the academy “%s”.\n\nOpen the link (valid for 72 hours):\n%s\n\nIf you were not expecting an invitation, please ignore this email.
application.approved.subject=JasTalant — academy application approved
application.approved.body=The application for academy “%s” has been approved. Your academy is connected and you have administrator access.\n\nSign in and open the CRM:\n%s
application.rejected.subject=JasTalant — academy application rejected
application.rejected.body=The application for academy “%s” has been rejected.\n\nReason: %s\n\nYou can correct the academy name and resubmit the application in your account:\n%s
