spring.application.name=jastalant-backend

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.error.include-message=never
server.error.include-stacktrace=never

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=jastalant
app.auth.refresh-days=${AUTH_REFRESH_DAYS:30}
app.auth.refresh-cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:true}
app.mail.from=${MAIL_FROM:no-reply@jastalant.local}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
