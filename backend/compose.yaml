name: jastalant-local

services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jastalant
      POSTGRES_USER: jastalant
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jastalant -d jastalant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
